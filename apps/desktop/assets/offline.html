<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoalOS — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #050814;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-image: radial-gradient(circle at 50% 30%, rgba(59, 108, 246, 0.15), transparent 60%);
    }
    .panel {
      background-color: #0a1224;
      border: 1px solid rgba(59, 108, 246, 0.4);
      box-shadow: 0 0 25px rgba(0, 210, 255, 0.15);
      border-radius: 12px;
      padding: 40px;
      max-width: 480px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #ef4444;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      color: #ffffff;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
    }
    .btn:hover {
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.6);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="badge">Connection Offline</div>
    <h1>System Signal Lost</h1>
    <p>GoalOS could not connect to the Hunter network. Please verify your internet connection or local server status.</p>
    <button class="btn" onclick="window.location.reload()">Re-establish Link</button>
  </div>
</body>
</html>
